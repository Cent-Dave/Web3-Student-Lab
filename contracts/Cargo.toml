[workspace]
members = [
    "auth_checker",
    "automated_testing_suite",
    "cicd_pipeline",
    "commit_reveal_rng",
    "content_management_system",
    "continuous_bonding_curve",
    "course_proxy",
    "cross_chain_client",
    "dao_governance",
    "did_registry",
    "fractional_nft_vault",
    "freelance-platform",
    "hackathon-team-matching",
    "hello_world",
    "implementation_v1",
    "implementation_v2",
    "lending_pool",
    "multisig_wallet_timelock",
    "parametric_insurance",
    "payment_gateway",
    "payment_streaming",
    "pr_simulation",
    "proxy",
    "quadratic_funding",
    "smart_vault",
    "testnet_faucet_integration",
    "zk_proof_verifier",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "26.1.0"

[dev-dependencies]
soroban-sdk = { version = "26.1.0", features = ["testutils"] }
rand = { version = "0.8", features = ["small_rng"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
